# hyprlock.conf - Qypr-inspired lock screen
# Faithful reproduction of the Qypr shell lock screen design
# Gruvbox Dark palette + glassmorphism
#
# Layout mirrors Qypr LockScreen.qml:
#   - Blurred screenshot with dark overlay (simulates video background)
#   - Large clock centered in upper 22% (96px, thin weight)
#   - Date below clock (28px, light weight)
#   - Pill-shaped password field centered below clock (glassmorphic)
#   - Single power icon bottom-right (always visible)
#
# Reference: https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/

# =============================================================================
# Variables
# =============================================================================

$font = GeistMono NF
$mono = GeistMono NFM

# Gruvbox Dark palette (active Qypr theme)
$bg0 = rgb(40, 40, 40)
$bg1 = rgb(60, 56, 54)
$bg2 = rgb(80, 73, 69)
$bg3 = rgb(102, 92, 84)
$bg4 = rgb(124, 111, 100)

$fg0 = rgb(251, 241, 199)
$fg1 = rgb(235, 219, 178)
$fg2 = rgb(213, 196, 161)
$fg3 = rgb(189, 174, 147)
$fg4 = rgb(168, 153, 132)

$bblue = rgb(131, 165, 152)
$bred = rgb(251, 73, 52)
$bgreen = rgb(184, 187, 38)
$byellow = rgb(250, 189, 47)
$borange = rgb(254, 128, 25)
$bpurple = rgb(211, 134, 155)

# =============================================================================
# General
# =============================================================================

general {
    hide_cursor = false
    immediate_render = true
}

# =============================================================================
# Animations
# =============================================================================

animations {
    enabled = true
}

# Smooth easeOutCubic - matches Qypr's Easing.InOutQuad reveal
bezier = qyprReveal, 0.25, 0.46, 0.45, 0.94

animation = fadeIn, 1, 5, qyprReveal
animation = fadeOut, 1, 5, qyprReveal
animation = inputFieldDots, 1, 2, qyprReveal

# =============================================================================
# Background - Blurred screenshot + dark overlay
# Mirrors Qypr's VideoBackground with 15% black overlay
# =============================================================================

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 8
    noise = 0.012
    contrast = 0.85
    brightness = 0.55
    vibrancy = 0.15
    color = rgba(0, 0, 0, 0.15)
}

# =============================================================================
# Clock - Large time display
# Matches Qypr: 96px, Font.Thin, centered at 22% from top
# Uses $TIME for live updates (hyprlock built-in variable)
# =============================================================================

label {
    monitor =
    text = $TIME
    color = $fg1
    font_size = 96
    font_family = $font

    # Text shadow for readability over blurred background
    # Matches Qypr: shadowOpacity=0.6, shadowOffset=2
    shadow_passes = 2
    shadow_color = rgba(0, 0, 0, 0.6)
    shadow_size = 6

    position = 0, 80
    halign = center
    valign = center
}

# =============================================================================
# Date - Below clock
# Matches Qypr: 28px, Font.Light, textSubtle color (#a6adc8)
# Uses cmd update every 60s to match Qypr's SystemClock.Seconds behavior
# =============================================================================

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = $fg3
    font_size = 28
    font_family = $font

    shadow_passes = 2
    shadow_color = rgba(0, 0, 0, 0.6)
    shadow_size = 4

    position = 0, 20
    halign = center
    valign = center
}

# =============================================================================
# Password Field - Glassmorphic pill shape
# Matches Qypr PasswordField.qml:
#   - 420x56, rounding=9999 (pill)
#   - glass background (#40313244 = rgba(49,50,68,0.25))
#   - glassBorder default (#30cdd6f4)
#   - primary color on focus (#89b4fa)
#   - placeholder text muted (#6c7086)
# =============================================================================

input-field {
    monitor =
    size = 420, 56
    outline_thickness = 2
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true

    # Glassmorphic fill - matches Theme.colors.glass
    outer_color = rgba(49, 50, 68, 0.25)

    # Transparent inner - only dots visible
    inner_color = rgba(49, 50, 68, 0.0)

    # Text color - matches Theme.colors.text
    font_color = $fg1

    # Check/fail states - matches Theme.colors.primary / Theme.colors.error
    check_color = $bblue
    fail_color = $bred

    # Pill shape - matches Theme.radius.round = 9999
    rounding = 9999

    fade_on_empty = true
    hide_input = false

    placeholder_text = <span foreground="#6c7086">  Enter password...</span>
    fail_text = $PAMFAIL

    position = 0, -80
    halign = center
    valign = center
}

# =============================================================================
# Single Power Button - Bottom right (always visible)
# Matches Qypr: ActionButton with "⏻" icon, 70% opacity
# =============================================================================

label {
    monitor =
    text = 󰐥
    color = rgba(189, 174, 147, 0.7)
    font_size = 24
    font_family = $mono

    position = -40, 40
    halign = right
    valign = bottom
}
